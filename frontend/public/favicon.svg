<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="blueSquircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="blueSquircleRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="blueDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#1d4ed8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Blue Squircle with Soft Drop Shadow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#blueSquircleGrad)" filter="url(#blueDropShadow)" />
  <!-- Subtle Glass Rim Light -->
  <rect x="4" y="4" width="56" height="56" rx="16" stroke="url(#blueSquircleRim)" stroke-width="1.5" />

  <!-- Centered Pure White Trending Up Arrow -->
  <g transform="translate(14, 14) scale(1.5)">
    <polyline
      points="22 7 13.5 15.5 8.5 10.5 2 17"
      fill="none"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <polyline
      points="16 7 22 7 22 13"
      fill="none"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>