<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Main Ascent Ribbon Gradient (Vibrant Cyan to Electric Indigo) -->
    <linearGradient id="surgeGrad" x1="10%" y1="100%" x2="90%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Loop Fold Gradient (Indigo to Violet/Pink) -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glass Reflection Highlight -->
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Ribbon Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#020617" flood-opacity="0.6" />
    </filter>

    <filter id="coreBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Subtle Outer Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Light Reflection inside Squircle -->
  <rect x="3" y="3" width="58" height="28" rx="15" fill="url(#glassHighlight)" />

  <!-- Inner Ambient Glow Behind Logo -->
  <circle cx="34" cy="28" r="18" fill="url(#ambientGlow)" />

  <!-- Back Layer: Loop of the "P" / Financial Growth Arc -->
  <path d="M26 15 C37 15 47 21 47 31 C47 39 39 44 28 44 C25 44 23 43 21 42"
        fill="none"
        stroke="url(#foldGrad)"
        stroke-width="5.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9"
        filter="url(#shadow)" />

  <!-- Front Layer: Dynamic Ascending Surge (Pillar + Vector Arrow Surge) -->
  <path d="M19 49 L19 23 C19 18 24 15 29 15 L37 15"
        fill="none"
        stroke="url(#surgeGrad)"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Dynamic Upward Diagonal Arrow / Chart Peak Surge -->
  <path d="M19 41 L31 29 L41 33 L51 17"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#coreBloom)" />

  <!-- Glowing Arrowhead / Spark Peak -->
  <polygon points="51,17 43,18 47,24" fill="#34d399" />
  <circle cx="51" cy="17" r="2.5" fill="#ffffff" />
</svg>